name: Deploy to cPanel

# Push-to-deploy: every push to main uploads the site to your cPanel host over FTPS.
# Add repository secrets: FTP_HOST, FTP_USER, FTP_PASS  (Settings → Secrets → Actions)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Upload to cPanel via FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASS }}
          protocol: ftps
          server-dir: public_html/
          exclude: |
            **/.git*
            **/.git*/**
            deploy/**
            README.md
            .github/**
